            // Zapamatujeme si label, pro který šablonu načítáme.

            loadTemplateById(templateId)

                        requestedLabelId
                    ) {

    // ----------------------------------------------------------
    // Načtení konkrétní šablony podle ID
    // Nezávislé na aktuální stránce gridTemplates.
    // ----------------------------------------------------------
    function loadTemplateById(templateId) {

        if (!templateId) {
            return $.Deferred()
                .resolve(null)
                .promise();
        }

        // Pokud ji už máme v cache, použijeme ji.
        const cached =
            AppState.templatesCache.find(
                t => t.id == templateId
            );

        if (cached) {
            return $.Deferred()
                .resolve(cached)
                .promise();
        }

        // Jinak ji načteme přímo ze serveru.
        return $.getJSON(
            APIURL + "datagrid.php",
            {
                grid: "templates",
                filter: JSON.stringify([
                    "id",
                    "=",
                    String(templateId)
                ])
            }
        ).then(function(res) {

            if (!res.data || res.data.length === 0) {
                return null;
            }

            const template = res.data[0];

            // Stejné pomocné hodnoty jako při loadu gridu.
            const meta = template.metajson || {};

            template.Picture =
                meta.Picture || "DUMMY.png";

            template.Template =
                meta.Template || "DUMMY.html";

            // DŮLEŽITÉ:
            // nepřepisujeme cache, pouze konkrétní
            // šablonu do cache doplníme.
            const existingIndex =
                AppState.templatesCache.findIndex(
                    t => t.id == template.id
                );

            if (existingIndex >= 0) {
                AppState.templatesCache[existingIndex] =
                    template;
            } else {
                AppState.templatesCache.push(template);
            }

            return template;
        });
    }


    // Pomocná funkce pro Lookupy (vrací Store, ne DataSource)
    function createStoreForLookup(gridName, extraParams = {}) {
        // Použijeme existující createDataSource, ale vytáhneme z něj jen vnitřní store
        return createDataSource(gridName, extraParams).store();
    }

    // Univerzální funkce pro vytvoření Store
    function createStore(gridName, extraParams = {}, returnRawStore = false) {
        const store = new DevExpress.data.CustomStore({
            key: "id",
            useDefaultSearch: false, 
            load: function(loadOptions) {
                const d = $.Deferred();
                const params = {
                    grid: gridName,
                    skip: loadOptions.skip || 0,
                    take: loadOptions.take || 10,
                    ...extraParams
                };

                if (loadOptions.searchValue) params.searchValue = loadOptions.searchValue;
                if (loadOptions.filter) params.filter = JSON.stringify(loadOptions.filter);

                $.getJSON(APIURL + "datagrid.php", params)
                    .done(res => {
                        if (gridName === "templates") {
                            //puvodni verze
                            //AppState.templatesCache = res.data;
                            //console.log("Templates cache aktualizována:", AppState.templatesCache.length);
                            //NOVA verze
                            res.data.forEach(t => {
                                const meta = t.metajson || {};

                                t.Picture = meta.Picture || "DUMMY.png";
                                t.Template = meta.Template || "DUMMY.html";
                            });

                            AppState.templatesCache = res.data;
                        }
                        console.log("templates: "+res.data);
                        d.resolve(res.data, { totalCount: res.totalCount });
                    })
                    .fail(() => d.reject("Data Load Error"));
                return d.promise();
            },

            byKey: function(key) {
                const d = $.Deferred();
                console.log("createStore byKey key> "+key);
                const cleanKey = String(Array.isArray(key) ? key[0] : key);
                $.getJSON(APIURL + "datagrid.php", {
                    grid: gridName,
                    filter: JSON.stringify(["id", "=", cleanKey])
                })
                .done(res => {
                    d.resolve(res.data && res.data.length > 0 ? res.data[0] : null);
                })
                .fail(() => d.reject("Data Key Load Error"));
                return d.promise();
            },

            // --- REFAKTOROVANÝ INSERT ---
            insert: (values) => {
                const d = $.Deferred();
                $.ajax({
                    url: APIURL + `${gridName}-record.php`,
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ grid: gridName, operation: "insert", data: [values] })
                })
                .done(res => {
                    // Naše PHP vrací { ids: ["25"] }, Postgres RETURNING vrací pole.
                    // Vezmeme první ID a sloučíme ho s původními hodnotami pro grid.
                    const newId = (res.ids && res.ids.length > 0) ? res.ids[0] : null;
                    const result = { ...values, id: newId };
                    
                    console.log(`Insert ${gridName} OK, nové ID:`, newId);
                    d.resolve(result); // Toto ID se nyní propíše do e.key v onRowInserted
                })
                .fail(err => {
                    console.error(`Insert ${gridName} failed:`, err);
                    d.reject(err);
                });
                return d.promise();
            },

            // --- REFAKTOROVANÝ UPDATE ---
            update: (key, values) => {
                const d = $.Deferred();
                $.ajax({
                    url: APIURL + `${gridName}-record.php`,
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ grid: gridName, operation: "update", data: [{ id: key, ...values }] })
                })
                .done(res => {
                    // Vrátíme sloučený objekt pro okamžitý refresh řádku v UI
                    d.resolve({ id: key, ...values });
                })
                .fail(err => d.reject(err));
                return d.promise();
            },

            remove: (key) => $.ajax({
                url: APIURL + `${gridName}-record.php`,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ grid: gridName, operation: "delete", key: [{ id: key }] })
            })
        });

        if (returnRawStore) return store;

        return new DevExpress.data.DataSource({
            store: store,
            //key: "id" // <--- MUSÍ BÝT I TADY V OBALU
        });

        //return returnRawStore ? store : new DevExpress.data.DataSource({ store: store });
    }

    // Univerzální funkce pro vytvoření Store pro naše API-gridy
    function createDataSource(gridName, extraParams = {}) {
        return new DevExpress.data.DataSource({
            store: new DevExpress.data.CustomStore({
                key: "id",
                load: function(loadOptions) {
                    const d = $.Deferred();
                    const params = {
                        grid: gridName,
                        skip: loadOptions.skip || 0,
                        take: loadOptions.take || 10,
                        ...extraParams
                    };

                    if (loadOptions.searchValue) params.searchValue = loadOptions.searchValue;
                    if (loadOptions.filter) params.filter = JSON.stringify(loadOptions.filter);
                    if (loadOptions.sort) params.sort = JSON.stringify(loadOptions.sort);                    

                    $.getJSON(APIURL + "datagrid.php", params)
                        .done(res => {
                            // Aktualizace cache pro šablony
                            if (gridName === "templates") {
                                //stara verze
                                //AppState.templatesCache = res.data;
                                // nova verze
                                res.data.forEach(t => {

                                    const meta = t.metajson || {};

                                    // UI pomocná pole.
                                    // V DB samostatně NEEXISTUJÍ.
                                    t.Picture = meta.Picture || "DUMMY.png";
                                    t.Template = meta.Template || "DUMMY.html";
                                });

                                AppState.templatesCache = res.data;                                
                            }
                            d.resolve(res.data, { totalCount: res.totalCount });
                        })
                        .fail(() => d.reject("Data Load Error"));
                    return d.promise();
                },

                byKey: function(key) {
                    const d = $.Deferred();
                    const cleanKey = String(Array.isArray(key) ? key[0] : key);
                    $.getJSON(APIURL + "datagrid.php", {
                        grid: gridName,
                        filter: JSON.stringify(["id", "=", cleanKey])
                    })
                    .done(res => {
                        d.resolve(res.data && res.data.length > 0 ? res.data[0] : null);
                    })
                    .fail(() => d.reject("Data Key Error"));
                    return d.promise();
                },

                // --- OPRAVENÝ INSERT ---
                insert: function(values) {
                    const d = $.Deferred();
                    $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "insert", data: [values] })
                    })
                    .done(res => {
                        // PHP vrací { ids: ["25"] } -> vezmeme první hodnotu
                        const newId = (res.ids && res.ids.length > 0) ? res.ids[0] : null;
                        
                        // Sloučíme zadané hodnoty s novým ID z databáze
                        const result = Object.assign({}, values, { id: newId });
                        
                        console.log(`Insert ${gridName} úspěšný, nové ID:`, newId);
                        
                        // Vyřešením s kompletním objektem (včetně ID) zamezíme _DX_KEY_
                        d.resolve(result);
                    })
                    .fail(err => d.reject(err));
                    return d.promise();
                },

                update: function(key, values) {
                    const d = $.Deferred();
                    $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "update", data: [{ id: key, ...values }] })
                    })
                    .done(() => d.resolve({ id: key, ...values }))
                    .fail(err => d.reject(err));
                    return d.promise();
                },

                remove: function(key) {
                    return $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "delete", key: [{ id: key }] })
                    });
                }
            })
        });
    }

    function runDataPump(url, buttonInstance, statusSelector, runningText) {
        const $status = $(statusSelector);
        buttonInstance.option("disabled", true);

        $status
            .removeClass("text-success text-danger")
            .addClass("text-primary")
            .html(
                '<span class="spinner-border spinner-border-sm me-2"></span>' +
                runningText
            );

        $.ajax({
            url: APIURL + url,
            method: "GET",
            dataType: "json",
            timeout: 120000
        })
        .done(function(res) {
            if (res.result !== "ok") {
                $status
                    .removeClass("text-primary")
                    .addClass("text-danger")
                    .text(res.message || "Synchronizace skončila chybou.");

                return;
            }
            const count =
                Number(res.count || 0)
                    .toLocaleString("cs-CZ");
            const duration =
                Number(res.duration || 0)
                    .toLocaleString(
                        "cs-CZ",
                        {
                            minimumFractionDigits: 2,
                            maximumFractionDigits: 2
                        }
                    );

            $status
                .removeClass("text-primary")
                .addClass("text-success")
                .html(
                    `<i class="bi bi-check-circle-fill me-1"></i>` +
                    `Synchronizováno ${count} záznamů za ${duration} s`
                );
            loadStats();
        })
        .fail(function(xhr, textStatus) {

            console.error(
                "DataPump error:",
                textStatus,
                xhr.responseText
            );

            let message = "Synchronizace skončila chybou.";

            // Pokud PHP poslalo náš JSON error
            if (xhr.responseJSON && xhr.responseJSON.message) {
                message = xhr.responseJSON.message;
            }

            if (textStatus === "timeout") {
                message = "Synchronizace překročila časový limit.";
            }

            $status
                .removeClass("text-primary")
                .addClass("text-danger")
                .html(
                    `<i class="bi bi-exclamation-triangle-fill me-1"></i>` +
                    message
                );
        })
        .always(function() {

            buttonInstance.option(
                "disabled",
                !canSave
            );
        });
    }


    function loadStats() {
        $.getJSON(APIURL + "stats.php")
            .done(function(res) {
                if (res.result !== "ok") {
                    console.error("Stats error:", res.message);
                    return;
                }
                $("#statLabels").text(
                    Number(res.labels || 0).toLocaleString("cs-CZ")
                );
                $("#statTemplates").text(
                    Number(res.templates || 0).toLocaleString("cs-CZ")
                );
                $("#statStorecards").text(
                    Number(res.storecards || 0).toLocaleString("cs-CZ")
                );
                $("#statBusTransactions").text(
                    Number(res.bustransactions || 0).toLocaleString("cs-CZ")
                );
            })
            .fail(function(xhr) {

                console.error(
                    "Stats request failed:",
                    xhr.responseText
                );

                $("#statLabels").text("—");
                $("#statTemplates").text("—");
                $("#statStorecards").text("—");
                $("#statBusTransactions").text("—");
            });
    }

    // nova verze onRowInserted - vylepsene rizeni 
    onRowInserted: function(e) {

        // -------------------------------------------------
        // 1. ID nové šablony
        // -------------------------------------------------
        const newId =
            Array.isArray(e.key)
                ? e.key[0]
                : (e.key || e.data.id);

        const templatesGrid =
            e.component;

        if (!newId) {

            console.error(
                "Nová šablona nemá ID."
            );

            return;
        }

        const picture =
            e.data.Picture ||
            "DUMMY.png";

        const htmlTemplate =
            e.data.Template ||
            "DUMMY.html";

        console.log(
            "Zpracovávám novou šablonu ID:",
            newId
        );

        // -------------------------------------------------
        // 2. Nejprve dokončíme META_JSON
        // -------------------------------------------------
        saveNewTemplateMeta(
            newId,
            picture,
            htmlTemplate
        )

        .done(function() {

            // -------------------------------------------------
            // 3. Aktuální filtr gridu
            // -------------------------------------------------
            const currentFilter =
                templatesGrid.getCombinedFilter(true);

            // -------------------------------------------------
            // 4. Aktuální remote sort
            // -------------------------------------------------
            const currentSort = [];

            templatesGrid
                .getVisibleColumns()
                .filter(col => col.sortOrder)
                .sort((a, b) =>
                    (a.sortIndex ?? 0) -
                    (b.sortIndex ?? 0)
                )
                .forEach(function(col) {

                    let selector =
                        col.dataField;

                    // Lookup/display sloupce musí použít
                    // STEJNÝ selector jako běžný remote sort.
                    if (col.dataField === "printerid") {
                        selector = "printername";
                    }

                    if (col.dataField === "scid") {
                        selector = "sccode";
                    }

                    if (col.dataField === "btid") {
                        selector = "btcode";
                    }

                    if (selector) {
                        currentSort.push({
                            selector: selector,
                            desc:
                                col.sortOrder === "desc"
                        });
                    }
                });

            // -------------------------------------------------
            // 5. LOCATE parametry
            // -------------------------------------------------
            const locateParams = {
                grid: "templates",
                locateId: newId
            };

            if (currentFilter) {
                locateParams.filter =
                    JSON.stringify(
                        currentFilter
                    );
            }

            if (currentSort.length > 0) {
                locateParams.sort =
                    JSON.stringify(
                        currentSort
                    );
            }

            console.log(
                "LOCATE template:",
                newId,
                locateParams
            );

            // -------------------------------------------------
            // 6. Server zjistí skutečnou pozici šablony
            // -------------------------------------------------
            $.getJSON(
                APIURL + "datagrid.php",
                locateParams
            )

            .done(function(location) {

                console.log(
                    "LOCATE template result:",
                    location
                );

                // -------------------------------------------------
                // 7. Nová šablona neodpovídá aktivnímu filtru
                // -------------------------------------------------
                if (location.rowIndex === null) {

                    console.warn(
                        "Nová šablona není v aktuálně filtrovaném datasetu."
                    );

                    AppState.setTemplateForEdit(
                        newId
                    );

                    DevExpress.ui.notify(
                        "Šablona vytvořena, ale neodpovídá aktuálnímu filtru.",
                        "warning",
                        3000
                    );

                    return;
                }

                // -------------------------------------------------
                // 8. Absolutní rowIndex -> stránka
                // -------------------------------------------------
                const pageSize =
                    templatesGrid.pageSize();

                const targetPage =
                    Math.floor(
                        location.rowIndex /
                        pageSize
                    );

                console.log(
                    "Template:",
                    newId,
                    "rowIndex:",
                    location.rowIndex,
                    "pageIndex:",
                    targetPage
                );

                // -------------------------------------------------
                // 9. Přepnutí na správnou stránku
                // -------------------------------------------------
                templatesGrid.pageIndex(
                    targetPage
                );

                templatesGrid.refresh()

                    .done(function() {

                        // -----------------------------------------
                        // 10. Označení nové šablony
                        // -----------------------------------------
                        templatesGrid.selectRows(
                            [newId],
                            false
                        );

                        // onSelectionChanged by to udělal také,
                        // ale explicitně držíme AppState správně.
                        AppState.setTemplateForEdit(
                            newId
                        );

                        DevExpress.ui.notify(
                            "Šablona vytvořena a vybrána.",
                            "success",
                            2000
                        );
                    })

                    .fail(function(error) {

                        console.error(
                            "Refresh Templates po LOCATE selhal:",
                            error
                        );
                    });
            })

            .fail(function(xhr) {

                console.error(
                    "LOCATE template selhal:",
                    xhr.responseText
                );
            });
        });
    },

    /**
     * Uloží aktuální stav META_JSON zpět do PostgreSQL.
     *
     * META_JSON:
     * {
     *     Fields: [...],
     *     Picture: "...",
     *     Template: "..."
     * }
     */
    function saveTemplateMeta() {

        const templateId = AppState.selectedTemplateId;

        if (!templateId) {
            return;
        }

        const grid = $("#gridTemplateMeta").dxDataGrid("instance");

        if (!grid) {
            return;
        }

        // ------------------------------------------------------
        // 1. Fields
        // ------------------------------------------------------

        const allRows = grid.getDataSource().items();

        const cleanedFields = allRows.map(row => {

            const cleanRow = {};

            for (let key in row) {

                // Ignorujeme interní vlastnosti DevExtreme
                if (!key.startsWith('__')) {
                    cleanRow[key] = row[key];
                }
            }

            // Content nesmí být null
            if (
                cleanRow.Content === null ||
                cleanRow.Content === undefined
            ) {
                cleanRow.Content = "";
            }

            return cleanRow;
        });


        // ------------------------------------------------------
        // 2. Picture + Template
        // ------------------------------------------------------

        const template = AppState.templatesCache.find(
            t => t.id == templateId
        );

        const currentMeta =
            template &&
            template.metajson
                ? template.metajson
                : {};

        const picture =
            currentMeta.Picture ||
            "DUMMY.png";

        const htmlTemplate =
            currentMeta.Template ||
            "DUMMY.html";


        // ------------------------------------------------------
        // 3. Finální META_JSON
        // ------------------------------------------------------

        const metaJson = {
            Fields: cleanedFields,
            Picture: picture,
            Template: htmlTemplate
        };


        console.log(
            "Odesílám META_JSON:",
            metaJson
        );


        // ------------------------------------------------------
        // 4. Uložení
        // ------------------------------------------------------

        $.ajax({
            url: APIURL + "templates-record.php",
            method: "POST",
            contentType: "application/json",

            data: JSON.stringify({
                grid: "templates",
                operation: "update",

                data: [{
                    id: templateId,
                    meta_json: metaJson
                }]
            })

        })
        .done(function() {

            // Aktualizujeme cache
            if (template) {
                template.metajson = metaJson;
            }

            DevExpress.ui.notify(
                "Konfigurace šablony uložena",
                "success",
                1000
            );

        })
        .fail(function(xhr) {

            console.error(
                "Uložení META_JSON selhalo:",
                xhr
            );

            DevExpress.ui.notify(
                "Nepodařilo se uložit konfiguraci šablony.",
                "error",
                3000
            );
        });
    }

// NOVA funkce - test!!!
function createGridLookupEditor(container, cellInfo, gridName, filterType) {

    return $("<div>").dxDropDownBox({

        value: cellInfo.value,
        valueExpr: "id",
        displayExpr: "code",

        placeholder: "Vyberte...",

        dataSource: createDataSource(
            gridName,
            { filterType: filterType }
        ),

        contentTemplate: function(e) {

            const $grid = $("<div>").dxDataGrid({

                dataSource: e.component.getDataSource(),

                remoteOperations: true,

                columns: [
                    {
                        dataField: "code",
                        caption: "Kód"
                    },
                    {
                        dataField: "name",
                        caption: "Název"
                    }
                ],

                // ------------------------------------------
                // HLEDÁNÍ
                // ------------------------------------------

                searchPanel: {
                    visible: true,
                    width: "100%",
                    placeholder: "Hledat..."
                },

                selection: {
                    mode: "single"
                },

                selectedRowKeys: [
                    cellInfo.value
                ],

                height: 300,

                onSelectionChanged: function(selection) {

                    const keys =
                        selection.selectedRowKeys;

                    const value =
                        keys.length
                            ? keys[0]
                            : null;

                    e.component.option(
                        "value",
                        value
                    );

                    cellInfo.setValue(value);

                    if (keys.length) {
                        e.component.close();
                    }
                }
            });

            return $grid;
        }
    });
}

            // -------------------------------------------------
            const currentFilter =
                labelsGrid.getCombinedFilter(true);

            // -------------------------------------------------
            // 4. Zjistíme aktuální řazení gridu
            // -------------------------------------------------
            const currentSort = [];

            labelsGrid
                .getVisibleColumns()
                .filter(col => col.sortOrder)
                .sort((a, b) =>
                    (a.sortIndex ?? 0) -
                    (b.sortIndex ?? 0)
                )
                .forEach(function(col) {

                    // U sloupců Šablona/Karta máme
                    // calculateDisplayValue jako string:
                    // tempname / sccode.
                    //stara verze s chybnym sortem
                    /*
                    const selector =
                        typeof col.calculateDisplayValue === "string"
                            ? col.calculateDisplayValue
                            : col.dataField;
                    */

                    // nova verze s explicitnim sortem
                    let selector = col.dataField;
                    // Sloupce zobrazované přes jiné pole musí používat
                    // stejný selector jako remote sorting gridu.
                    if (col.dataField === "tempid") {
                        selector = "tempname";
                    }
                    if (col.dataField === "scid") {
                        selector = "sccode";
                    }




                    if (selector) {
                        currentSort.push({
                            selector: selector,
                            desc: col.sortOrder === "desc"
                        });
                    }
                });

            // -------------------------------------------------
            // 5. Parametry pro zaměřovací dotaz
            // -------------------------------------------------
            const locateParams = {
                grid: "labels",
                locateId: newId
            };

            if (currentFilter) {
                locateParams.filter =
                    JSON.stringify(currentFilter);
            }

            if (currentSort.length > 0) {
                locateParams.sort =
                    JSON.stringify(currentSort);
            }

            console.log(
                "LOCATE label:",
                newId,
                locateParams
            );

            // -------------------------------------------------
            // 6. Server zjistí skutečnou pozici nového labelu
            // -------------------------------------------------
            $.getJSON(
                APIURL + "datagrid.php",
                locateParams
            )

            .done(function(location) {

                console.log(
                    "LOCATE result:",
                    location
                );

                // Pokud nový label není v aktuálně
                // filtrovaném datasetu, není kam přecházet.
                if (location.rowIndex === null) {

                    console.warn(
                        "Nový label není v aktuálně filtrovaném datasetu."
                    );

                    AppState.setLabel(
                        newId,
                        templateId,
                        e.data.scid

                    const gridFields =
                        $("#gridFields")

                    DevExpress.ui.notify(

                        "warning",

                    );

                    return;

                // -------------------------------------------------
                // 7. Z rowIndex spočítáme stránku
                // -------------------------------------------------
                const pageSize =
                    labelsGrid.pageSize();

                const targetPage =
                    Math.floor(
                        location.rowIndex / pageSize
                    );

                console.log(
                    "Label:",
                    newId,
                    "rowIndex:",
                    location.rowIndex,
                    "pageIndex:",
                    targetPage
                );

                // -------------------------------------------------
                // 8. Přepneme grid na správnou stránku

                // Načteme stránku z DB.

                    .done(function() {

                        // -------------------------------------------------
                        // 9. Nový label je nyní na aktuální stránce
                        // -------------------------------------------------
                        labelsGrid.selectRows(
                            [newId],

                        // -------------------------------------------------

                        AppState.setLabel(

                        const gridFields =
                            $("#gridFields")

                        if (gridFields) {
                            gridFields.refresh();
                        }

                        DevExpress.ui.notify(
                            "Štítek a pole připravena.",
                            "success",
                            2000
                        );
                    })

                    .fail(function(error) {

                        console.error(
                            "Refresh gridu po LOCATE selhal:",
                            error
                        );
                    });
            })

            .fail(function(xhr) {

                console.error(
                    "LOCATE label selhal:",
                    xhr.responseText
                );
            });

        }).fail(function(xhr) {

            console.error(
                "Selhalo uložení polí:",
                xhr.responseText
            );
        });

        console.warn(
            "Šablona nemá žádná metadata k vygenerování polí.",

        );

            const requestedLabelId = labelId;

            if (!fieldsData) return;
            
            fieldsData.forEach(field => {
                // Hledáme v kontejneru náhledu element s id, který odpovídá name pole
                const $el = $("#previewTemplate").find(`#${field.name}`);
                if ($el.length > 0) {
                    $el.text(field.content || "");

            });

        // nova verze - vylepsena kontrola requestu
        function updateLivePreview() {

            const fieldsGrid =
                $("#gridFields")
                    .dxDataGrid("instance");

            console.log("updatelivepreview");

            if (
                !fieldsGrid ||
                !AppState.selectedLabel ||
                !AppState.selectedLabel.id
            ) {
                console.log(
                    "updateLivePreview: Přerušeno - chybí aktivní label."
                );

                return;
            }

            // -------------------------------------------------
            // Label, pro který tento resolver spouštíme.
            // -------------------------------------------------
            const requestedLabelId =
                AppState.selectedLabel.id;

            const payload = {
                label_id: requestedLabelId,

                bus_transaction:
                    AppState.selectedBusTransaction ||
                    {
                        id: null,
                        code: null
                    },

                storecard_id:
                    AppState.selectedLabel.storecard_id ||
                    null,

                fields:
                    fieldsGrid
                        .getDataSource()
                        .items() || []
            };

            console.log(
                "Odesílám k resolvování:",
                payload
            );

            $.ajax({
                url: APIURL + "resolve-preview.php",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(payload),

                success: function(resolvedData) {

                    // -------------------------------------------------
                    // Odpověď patří už neaktivnímu labelu.
                    // Zahodíme ji.
                    // -------------------------------------------------
                    if (
                        AppState.selectedLabel.id !=
                        requestedLabelId
                    ) {
                        console.log(
                            "RESOLVER response ignored:",
                            requestedLabelId,
                            "aktuální label:",
                            AppState.selectedLabel.id
                        );

                        return;
                    }

                    if (!resolvedData) {
                        return;
                    }

                    console.log(
                        "RESOLVER response accepted:",
                        requestedLabelId
                    );

                    for (
                        const [id, value]
                        of Object.entries(resolvedData)
                    ) {
                        $("#previewTemplate")
                            .find(`#${id}`)
                            .text(value);
                    }
                },

                error: function(xhr) {

                    // Starý request už nás nezajímá.
                    if (
                        AppState.selectedLabel.id !=
                        requestedLabelId
                    ) {
                        return;
                    }

                    console.error(
                        "Resolver error:",
                        xhr.responseText
                    );
                }
            });
        }

    function setToken(data){
        KCtoken=data;
        //tady xhttprequest na roli v abre a teprve potom yes/no access
        //pozor, preset musime spustit i tady, obcas je sso rychlejsi nez DOMContent
        //a diky tomu nejsou nastavene URL-cili vysledkem volani auth je 404 :D
        preset();

        if ('groups' in KCtoken){
            if (haveAllItems(KCtoken.groups, necessaryGroups)===true) {
                //tady xhttprequest na roli v abre a teprve potom yes/no access
                let senddata = {"preferred_username":KCtoken.preferred_username};
                makeRequest("POST", secURL + "authabra.php", JSON.stringify(senddata), responseAUTH,"",15000, "Ověřuji přístup");
            } else {
                noAccess();
            }
            //debug - shorting - yes je callback z xhttp roli
            //yesAccess();
        } else {
            
        }
        
    }

    function responseAUTH(response) {
        var abraAUTH = false;
        //console.log(JSON.parse(response));
        udata = JSON.parse(response);
        if (udata["status"]["result"]== "OK") {
            //processing - zjistime jeste roles ["data"][0]["userinfo"])
            if ("ID" in udata["data"][0]["userinfo"]) {
                if (udata["data"][0]["userinfo"]["locked"]===false && haveAllItems(udata["data"][0]["roleinfo"], necessaryRoles)) {
                    userData = udata["data"][0];
                    abraAUTH = true;
                    //a take nastavime canSave
                    canSave = haveAllItems(udata["data"][0]["roleinfo"], extendedRoles);
                    console.log("canSave= " + canSave);
                }
            }

        } else {
            //zadny data - noAccess
        }

        // pro DEMO kontrolu premostime
        //abraAUTH = true;

        if (abraAUTH === true){
            yesAccess();
        } else {
            noAccess();
        }
        
    }

    }
