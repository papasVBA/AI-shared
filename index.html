    // Pomocná funkce pro Lookupy (vrací Store, ne DataSource)
    function createStoreForLookup(gridName, extraParams = {}) {
        // Použijeme existující createDataSource, ale vytáhneme z něj jen vnitřní store
        return createDataSource(gridName, extraParams).store();
    }

    // Univerzální funkce pro vytvoření Store
    function createStore(gridName, extraParams = {}, returnRawStore = false) {
        const store = new DevExpress.data.CustomStore({
            key: "id",
            useDefaultSearch: false, 
            load: function(loadOptions) {
                const d = $.Deferred();
                const params = {
                    grid: gridName,
                    skip: loadOptions.skip || 0,
                    take: loadOptions.take || 10,
                    ...extraParams
                };

                if (loadOptions.searchValue) params.searchValue = loadOptions.searchValue;
                if (loadOptions.filter) params.filter = JSON.stringify(loadOptions.filter);

                $.getJSON(APIURL + "datagrid.php", params)
                    .done(res => {
                        if (gridName === "templates") {
                            AppState.templatesCache = res.data;
                            console.log("Templates cache aktualizována:", AppState.templatesCache.length);
                        }
                        console.log("templates: "+res.data);
                        d.resolve(res.data, { totalCount: res.totalCount });
                    })
                    .fail(() => d.reject("Data Load Error"));
                return d.promise();
            },

            byKey: function(key) {
                const d = $.Deferred();
                console.log("createStore byKey key> "+key);
                const cleanKey = String(Array.isArray(key) ? key[0] : key);
                $.getJSON(APIURL + "datagrid.php", {
                    grid: gridName,
                    filter: JSON.stringify(["id", "=", cleanKey])
                })
                .done(res => {
                    d.resolve(res.data && res.data.length > 0 ? res.data[0] : null);
                })
                .fail(() => d.reject("Data Key Load Error"));
                return d.promise();
            },

            // --- REFAKTOROVANÝ INSERT ---
            insert: (values) => {
                const d = $.Deferred();
                $.ajax({
                    url: APIURL + `${gridName}-record.php`,
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ grid: gridName, operation: "insert", data: [values] })
                })
                .done(res => {
                    // Naše PHP vrací { ids: ["25"] }, Postgres RETURNING vrací pole.
                    // Vezmeme první ID a sloučíme ho s původními hodnotami pro grid.
                    const newId = (res.ids && res.ids.length > 0) ? res.ids[0] : null;
                    const result = { ...values, id: newId };
                    
                    console.log(`Insert ${gridName} OK, nové ID:`, newId);
                    d.resolve(result); // Toto ID se nyní propíše do e.key v onRowInserted
                })
                .fail(err => {
                    console.error(`Insert ${gridName} failed:`, err);
                    d.reject(err);
                });
                return d.promise();
            },

            // --- REFAKTOROVANÝ UPDATE ---
            update: (key, values) => {
                const d = $.Deferred();
                $.ajax({
                    url: APIURL + `${gridName}-record.php`,
                    method: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ grid: gridName, operation: "update", data: [{ id: key, ...values }] })
                })
                .done(res => {
                    // Vrátíme sloučený objekt pro okamžitý refresh řádku v UI
                    d.resolve({ id: key, ...values });
                })
                .fail(err => d.reject(err));
                return d.promise();
            },

            remove: (key) => $.ajax({
                url: APIURL + `${gridName}-record.php`,
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({ grid: gridName, operation: "delete", key: [{ id: key }] })
            })
        });

        if (returnRawStore) return store;

        return new DevExpress.data.DataSource({
            store: store,
            //key: "id" // <--- MUSÍ BÝT I TADY V OBALU
        });

        //return returnRawStore ? store : new DevExpress.data.DataSource({ store: store });
    }

    // Univerzální funkce pro vytvoření Store pro naše API-gridy
    function createDataSource(gridName, extraParams = {}) {
        return new DevExpress.data.DataSource({
            store: new DevExpress.data.CustomStore({
                key: "id",
                load: function(loadOptions) {
                    const d = $.Deferred();
                    const params = {
                        grid: gridName,
                        skip: loadOptions.skip || 0,
                        take: loadOptions.take || 10,
                        ...extraParams
                    };

                    if (loadOptions.searchValue) params.searchValue = loadOptions.searchValue;
                    if (loadOptions.filter) params.filter = JSON.stringify(loadOptions.filter);

                    $.getJSON(APIURL + "datagrid.php", params)
                        .done(res => {
                            // Aktualizace cache pro šablony
                            if (gridName === "templates") {
                                AppState.templatesCache = res.data;
                            }
                            d.resolve(res.data, { totalCount: res.totalCount });
                        })
                        .fail(() => d.reject("Data Load Error"));
                    return d.promise();
                },

                byKey: function(key) {
                    const d = $.Deferred();
                    const cleanKey = String(Array.isArray(key) ? key[0] : key);
                    $.getJSON(APIURL + "datagrid.php", {
                        grid: gridName,
                        filter: JSON.stringify(["id", "=", cleanKey])
                    })
                    .done(res => {
                        d.resolve(res.data && res.data.length > 0 ? res.data : null);
                    })
                    .fail(() => d.reject("Data Key Error"));
                    return d.promise();
                },

                // --- OPRAVENÝ INSERT ---
                insert: function(values) {
                    const d = $.Deferred();
                    $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "insert", data: [values] })
                    })
                    .done(res => {
                        // PHP vrací { ids: ["25"] } -> vezmeme první hodnotu
                        const newId = (res.ids && res.ids.length > 0) ? res.ids : null;
                        
                        // Sloučíme zadané hodnoty s novým ID z databáze
                        const result = Object.assign({}, values, { id: newId });
                        
                        console.log(`Insert ${gridName} úspěšný, nové ID:`, newId);
                        
                        // Vyřešením s kompletním objektem (včetně ID) zamezíme _DX_KEY_
                        d.resolve(result);
                    })
                    .fail(err => d.reject(err));
                    return d.promise();
                },

                update: function(key, values) {
                    const d = $.Deferred();
                    $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "update", data: [{ id: key, ...values }] })
                    })
                    .done(() => d.resolve({ id: key, ...values }))
                    .fail(err => d.reject(err));
                    return d.promise();
                },

                remove: function(key) {
                    return $.ajax({
                        url: APIURL + `${gridName}-record.php`,
                        method: "POST",
                        contentType: "application/json",
                        data: JSON.stringify({ grid: gridName, operation: "delete", key: [{ id: key }] })
                    });
                }
            })
        });
    }

        /**
         * Funkce pro uložení aktuálního stavu Meta Gridu zpět do PostgreSQL
         */
        function saveTemplateMeta() {
            const templateId = AppState.selectedTemplateId;
            if (!templateId) return;
            // 1. Získáme surová data z gridu
            const allRows = $("#gridTemplateMeta").dxDataGrid("instance").getDataSource().items();

            // 2. Vyčištění dat (odstranění __KEY__ a ošetření null)
            const cleanedFields = allRows.map(row => {
                // Vytvoříme kopii objektu bez interních vlastností DevExtreme
                const cleanRow = {};
                for (let key in row) {
                    // Ignorujeme klíče začínající podtržítkem (jako __KEY__)
                    if (!key.startsWith('__')) {
                        cleanRow[key] = row[key];
                    }
                }
                
                // Zajištění, že Content není null (aby s tím PHP resolver neměl problém)
                if (cleanRow.Content === null || cleanRow.Content === undefined) {
                    cleanRow.Content = "";
                }
                
                return cleanRow;
            });

            // 3. Zabalíme do finální struktury
            const metaJson = { Fields: cleanedFields };

            console.log("Odesílám vyčištěný META_JSON:", metaJson);            




            // Zabalíme zpět do vaší struktury: { Fields: [...] }
            //const metaJson = { Fields: allRows };




            $.ajax({
                url: APIURL+"templates-record.php",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify({
                    grid: "templates",
                    operation: "update",
                    data: [{
                        id: templateId,
                        meta_json: metaJson
                    }]
                }),
                success: () => DevExpress.ui.notify("Konfigurace polí uložena", "success", 1000)
            });
        }

        function createGridLookupEditor(container, cellInfo, gridName, filterType) {
            return $("<div>").dxDropDownBox({
                value: cellInfo.value,
                valueExpr: "id",
                displayExpr: "code",
                placeholder: "Vyhledat...",
                dataSource: createDataSource(gridName, { filterType: filterType }),
                contentTemplate: function(e) {
                    const $grid = $("<div>").dxDataGrid({
                        dataSource: e.component.getDataSource(),
                        remoteOperations: true,
                        columns: ["code", "name"],
                        selection: { mode: "single" },
                        selectedRowKeys: [cellInfo.value],
                        height: 250,
                        onSelectionChanged: function(selection) {
                            const keys = selection.selectedRowKeys;
                            e.component.option("value", keys.length ? keys[0] : null);
                            cellInfo.setValue(keys.length ? keys[0] : null);
                            if (keys.length) e.component.close();
                        }
                    });
                    return $grid;
                }
            });
        }



    }

                    $("#previewTemplate").html('<div class="p-4 text-muted">Žádný výběr</div>');
                    return;
                }

                const meta = AppState.currentTemplateFull.metajson;

                // 1. Zobrazení obrázku
                if (meta && meta.Picture) {
                    $("#previewPicture").html(`<img src="${PATH_PICS}${meta.Picture}" class="img-fluid " style="max-height:100%">`);
                } else {
                    $("#previewPicture").html('<div class="p-4 text-warning">Obrázek nenalezen</div>');
                }

                // 2. Načtení HTML šablony a její naplnění daty
                if (meta && meta.Template) {
                    $.get(PATH_TEMPS + meta.Template, function(html) {
                        $("#previewTemplate").html(html);
                        
                        // Po načtení šablony ji hned naplníme aktuálními daty z gridu
                        const fieldsGrid = $("#gridFields").dxDataGrid("instance");
                        if (fieldsGrid) {
                            const data = fieldsGrid.getDataSource().items();
                            updateHtmlTemplate(data);
                        }
                    }).fail(() => {
                        $("#previewTemplate").html('<div class="p-4 text-danger">HTML šablona chybí</div>');
                    });
                }            
        });

        // --- LISTENER PRO ŽIVOU AKTUALIZACI (Změna textu v gridu) ---
        AppState.on('previewNeedRefresh', function(data) {
            //updateHtmlTemplate(data);
            updateLivePreview();
        });
        // Aktualizace při změně obchodního případu
        AppState.on('busTransactionChanged', function() {
            updateLivePreview();
        });        

        /**
         * Pomocná funkce pro vložení textů do HTML elementů podle ID
         */
        function updateHtmlTemplate(fieldsData) {
            if (!fieldsData) return;
            
            fieldsData.forEach(field => {
                // Hledáme v kontejneru náhledu element s id, který odpovídá name pole
                const $el = $("#previewTemplate").find(`#${field.name}`);
                if ($el.length > 0) {
                    $el.text(field.content || "");
                }
            });
        }
        /**
         * Hlavní funkce pro aktualizaci náhledu přes PHP Resolver
         */
        function updateLivePreview() {
            const fieldsGrid = $("#gridFields").dxDataGrid("instance");
            console.log("updatelivepreview");
            // BEZPEČNOSTNÍ POJISTKA: Pokud nemáme vybraný label nebo grid ještě není ready
            if (!fieldsGrid || !AppState.selectedLabel || !AppState.selectedLabel.id) {
                console.log("updateLivePreview: Přerušeno - chybí aktivní label.");
                return;
            }

            const payload = {
                label_id: AppState.selectedLabel.id,
                // Použijeme bezpečný přístup přes || {}
                bus_transaction: AppState.selectedBusTransaction || { id: null, code: null },
                storecard_id:  AppState.selectedLabel.storecard_id || null,
                fields: fieldsGrid.getDataSource().items() || []
            };

            console.log("Odesílám k resolvování:", payload);

            $.ajax({
                url: APIURL + "resolve-preview.php",
                method: "POST",
                contentType: "application/json",
                data: JSON.stringify(payload),
                success: function(resolvedData) {
                    if (!resolvedData) return;
                    
                    for (const [id, value] of Object.entries(resolvedData)) {
                        $("#previewTemplate").find(`#${id}`).text(value);
                    }
                },
                error: function(xhr) {
                    console.error("Resolver error:", xhr.responseText);
                }
            });
        }

        /**
         * Pomocná funkce pro zobrazení tlačítka smazat
         */
        function updateDeleteButtonVisibility(visible) {
            // Najdeme instanci tlačítka přes jeho CSS třídu
            const $btn = $(".bulk-delete-button");
            if ($btn.length) {
                const btnInstance = $btn.dxButton("instance");
                if (btnInstance) {
                    // Tlačítko uvidíme jen když je "bulk" mód aktivní A ZÁROVEŇ máme práva k zápisu
                    btnInstance.option("visible", visible && canSave);
                }
            }
        }        


    }

    function setToken(data){
        KCtoken=data;
        //tady xhttprequest na roli v abre a teprve potom yes/no access
        //pozor, preset musime spustit i tady, obcas je sso rychlejsi nez DOMContent
        //a diky tomu nejsou nastavene URL-cili vysledkem volani auth je 404 :D
        preset();

        if ('groups' in KCtoken){
            if (haveAllItems(KCtoken.groups, necessaryGroups)===true) {
                //tady xhttprequest na roli v abre a teprve potom yes/no access
                let senddata = {"preferred_username":KCtoken.preferred_username};
                makeRequest("POST", secURL + "authabra.php", JSON.stringify(senddata), responseAUTH,"",15000, "Ověřuji přístup");
            } else {
                noAccess();
            }
            //debug - shorting - yes je callback z xhttp roli
            //yesAccess();
        } else {
            
        }
        
    }

    function responseAUTH(response) {
        var abraAUTH = false;
        //console.log(JSON.parse(response));
        udata = JSON.parse(response);
        if (udata["status"]["result"]== "OK") {
            //processing - zjistime jeste roles ["data"][0]["userinfo"])
            if ("ID" in udata["data"][0]["userinfo"]) {
                if (udata["data"][0]["userinfo"]["locked"]===false && haveAllItems(udata["data"][0]["roleinfo"], necessaryRoles)) {
                    userData = udata["data"][0];
                    abraAUTH = true;
                    //a take nastavime canSave
                    canSave = haveAllItems(udata["data"][0]["roleinfo"], extendedRoles);
                    console.log("canSave= " + canSave);
                }
            }

        } else {
            //zadny data - noAccess
        }

        // pro DEMO kontrolu premostime
        //abraAUTH = true;

        if (abraAUTH === true){
            yesAccess();
        } else {
            noAccess();
        }
        
    }

    function refreshToolTips() {
            if (tooltipList && tooltipList.length) {

    }
